    remote:
      path: Fluxer.Net/Gateway/Packets/FluxerOpCode.cs
      branch: release
      repo: https://github.com/Nexfinity/Fluxer.Net
    id: Heartbeat
    path: ../Fluxer.Net/Gateway/Packets/FluxerOpCode.cs
    startLine: 31
  assemblies:
  - Fluxer.Net
  namespace: Fluxer.Net.Gateway.Packets
  summary: >-
    Heartbeat packet to maintain connection.

    Bidirectional. Client sends periodically, server may request immediate heartbeat.
  remarks: >-
    Clients must send heartbeat packets at the interval specified in the HELLO event.

    The server responds with <xref href="Fluxer.Net.Gateway.Packets.FluxerOpCode.HeartbeatAck" data-throw-if-not-resolved="false"></xref>. Failure to heartbeat will result in disconnection.
  example: []
  syntax:
    content: Heartbeat = 1
    return:
      type: Fluxer.Net.Gateway.Packets.FluxerOpCode
