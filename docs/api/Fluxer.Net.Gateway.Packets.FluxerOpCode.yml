      repo: https://github.com/Nexfinity/Fluxer.Net
    id: Resume
    path: ../Fluxer.Net/Gateway/Packets/FluxerOpCode.cs
    startLine: 80
  assemblies:
  - Fluxer.Net
  namespace: Fluxer.Net.Gateway.Packets
  summary: >-
    Resumes a previous session after disconnection.

    Client → Server. Attempts to replay missed events from last sequence.
  remarks: >-
    Sent instead of IDENTIFY when reconnecting with a valid session ID.

    Contains session ID, sequence number, and token.

    Server responds with RESUMED event if successful, or INVALID_SESSION if failed.

    See <xref href="Fluxer.Net.Gateway.Data.ReconnectGatewayData" data-throw-if-not-resolved="false"></xref> for payload structure.
  example: []
  syntax:
    content: Resume = 6
    return:
      type: Fluxer.Net.Gateway.Packets.FluxerOpCode
