  summary: >-
    Gateway data for GUILD_CREATE and GUILD_UPDATE events.

    Contains the full guild state including channels, members, roles, and nested guild properties.

    When <xref href="Fluxer.Net.Gateway.Data.Guilds.GuildGatewayData.Unavailable" data-throw-if-not-resolved="false"></xref> is true the guild is temporarily unavailable (outage)

