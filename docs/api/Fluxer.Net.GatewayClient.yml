  assemblies:
  - Fluxer.Net
  namespace: Fluxer.Net
  summary: Establishes a WebSocket connection to the Fluxer gateway and sends the IDENTIFY packet.
  remarks: >-
    <p>

    This method:

    </p>

    <ol><li>Creates a WebSocket connection to the gateway URL specified in configuration</li><li>Sets up message and reconnection handlers</li><li>Sends an IDENTIFY packet with authentication token and presence</li><li>Waits for HELLO event to begin heartbeat mechanism</li></ol>

    <p>

    The connection will automatically reconnect on disconnect and attempt to resume the session.

    </p>
  example: []
  syntax:
    content: public Task ConnectAsync()
    return:
      type: System.Threading.Tasks.Task
      description: A task that represents the asynchronous connection operation.
    content.vb: Public Function ConnectAsync() As Task
  overload: Fluxer.Net.GatewayClient.ConnectAsync*
