    path: ../Fluxer.Net/Gateway/GatewayClient.cs
    startLine: 44
  assemblies:
  - Fluxer.Net
  namespace: Fluxer.Net
  summary: >-
    WebSocket gateway client for real-time events from the Fluxer platform.

    Handles bidirectional communication, automatic heartbeats, and reconnection with resume capability.
  remarks: >-
    <p>

    The GatewayClient provides an event-driven architecture for receiving real-time updates

    from Fluxer, including messages, user presence, guild changes, and more. It implements

    the Fluxer Gateway protocol with support for:

    </p>

    <ul><li>Automatic heartbeat mechanism to maintain connection</li><li>Sequence tracking for ordered event processing</li><li>Session-based reconnection with resume capability (no event loss)</li><li>Event filtering via <xref href="Fluxer.Net.FluxerConfig.IgnoredGatewayEvents" data-throw-if-not-resolved="false"></xref></li></ul>

    <p>

    This client should be paired with <xref href="Fluxer.Net.ApiClient" data-throw-if-not-resolved="false"></xref> for full Fluxer functionality.

    </p>
